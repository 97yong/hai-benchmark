name: 제출 반영

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  merge:
    if: startsWith(github.event.issue.title, '[submit]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          WHO: ${{ github.event.issue.user.login }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do                       # 동시 제출 대비 — 최신 상태로 다시 병합
            python3 .github/merge.py || exit 1
            grep -q '^ok=true' "$GITHUB_OUTPUT" || exit 0
            git add docs/data.json
            git diff --staged --quiet && exit 0
            git commit -q -m "Record submission from $WHO (#$NUM)"
            git push -q && exit 0
            echo "push rejected — retry $i"
            git reset --hard -q HEAD~1
            git pull --rebase -q
            sed -i '/^ok=/d;/^msg=/d' "$GITHUB_OUTPUT"
            sleep $((RANDOM % 5 + 2))
          done
          exit 1

      # 성공 알림은 외부 제출자에게만 — 저장소 주인은 submit.py 출력으로 이미 알고 있고,
      # 봇 댓글이 곧 메일이 되므로 주인 제출은 조용히 닫는다.
      - if: steps.merge.outputs.ok == 'true' && github.event.issue.user.login != github.repository_owner
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "${{ steps.merge.outputs.msg }} 잠시 뒤 리더보드에 나타납니다.
          https://97yong.github.io/hai-benchmark/"

      - if: steps.merge.outputs.ok == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue close ${{ github.event.issue.number }}

      - if: steps.merge.outputs.ok != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "반영하지 못했습니다. ${{ steps.merge.outputs.msg }}"
